services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pwcheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwcheck-local-only}
      POSTGRES_DB: pwcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwcheck -d pwcheck"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pwcheck:${POSTGRES_PASSWORD:-pwcheck-local-only}@db:5432/pwcheck?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
